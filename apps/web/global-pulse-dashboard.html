<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlobalPulse — Global Investment News Dashboard</title>
  <link rel="stylesheet" href="./dashboard.css">
  <!-- apiBase 등 런타임 설정은 config.js 에서 관리한다 -->
  <script src="./config.js"></script>
  <script src="./dashboard.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-brand">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
          <polyline points="16 7 22 7 22 13"/>
        </svg>
        <h1>Global<span>Pulse</span></h1>
      </div>
      <div class="header-actions">
        <span class="header-time" id="currentTime"></span>
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
          <div class="theme-toggle-icons">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          </div>
        </button>
      </div>
    </header>
    <main class="main">
      <div class="tabs" id="tabs"></div>
      <div class="dedup-bar" id="dedupBar"></div>
      <div class="content-grid">
        <div class="feed-section" id="feed"></div>
        <div class="sidebar">
          <div class="sidebar-card">
            <div class="sidebar-card-header">Delivery Schedule (KST)</div>
            <div class="sidebar-card-body"><ul class="schedule-list" id="scheduleList"></ul></div>
          </div>
          <div class="sidebar-card">
            <div class="sidebar-card-header">Categories</div>
            <div class="sidebar-card-body"><ul class="legend-list" id="legendList"></ul></div>
          </div>
          <div class="sidebar-card">
            <div class="sidebar-card-header">Source Health</div>
            <div class="sidebar-card-body" id="sourceHealth"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script>
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
      localStorage.setItem('theme', html.getAttribute('data-theme'));
    }
    (function() { const saved = localStorage.getItem('theme'); if (saved) document.documentElement.setAttribute('data-theme', saved); })();
  </script>
</body>
</html>
