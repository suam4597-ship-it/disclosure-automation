name: GlobalPulse pages deploy

# apps/web 정적 파일을 GitHub Pages로 배포한다.
# 사이트 루트(index.html)는 대시보드 — public-web-smoke의 셸 계약
# (GlobalPulse / config.js / Source Health / apiBase 마커)을 충족해야 한다.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/globalpulse-pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: globalpulse-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build static site
        run: |
          mkdir -p _site
          cp -r apps/web/. _site/
          cp apps/web/global-pulse-dashboard.html _site/index.html

      - name: Verify shell contract before publish
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("_site/index.html").read_text(encoding="utf-8")
          config = Path("_site/config.js").read_text(encoding="utf-8")
          for needle in ["GlobalPulse", "config.js", "Source Health", "apiBase"]:
              assert needle in html, f"missing shell marker: {needle}"
          for needle in [
              "window.GLOBALPULSE_RUNTIME_CONFIG",
              'environment: "staging"',
              "allowQueryParamOverride: true",
              "window.DISCLOSURE_API_BASE_URL",
              "greater_china", "eu_north", "eu_central", "eu_south",
          ]:
              assert needle in config, f"missing config marker: {needle}"
          print("shell contract pass")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
