name: GlobalPulse live staging poll

# 폴 대상(소스 목록·스케줄 매핑)은 config/sources.yml 에서 읽는다.
# 새 수집처/스케줄 추가는 이 파일이 아니라 config/sources.yml 을 수정한다.
on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend base URL"
        required: false
        default: "https://globalpulse-backend-staging.fly.dev"
      source_key:
        description: "Source key or group alias (see config/sources.yml) to poll live"
        required: false
        default: "sec_press_releases"
      edition:
        description: "Digest edition to verify after poll"
        required: false
        default: "breaking"
  schedule:
    # NOTE: cron 식은 config/sources.yml 의 groups[].schedule 과 1:1로 일치해야 한다.
    # Run at minute 7 every hour. Keep this conservative for public RSS sources.
    - cron: "7 * * * *"
    # Run the verified India NSE candidate every 2 hours on weekdays in staging.
    - cron: "37 */2 * * 1-5"
    # Run the HKEX latest-listed-company candidate every 2 hours on weekdays in staging.
    - cron: "22 */2 * * 1-5"
    # Run the first EU listed-company disclosure canary every 4 hours on weekdays in staging.
    - cron: "17 */4 * * 1-5"
    # Run the Denmark DFSA OAM candidate as a separate staging-only canary on weekdays.
    - cron: "47 */4 * * 1-5"

permissions:
  contents: read

concurrency:
  group: globalpulse-live-staging-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: ${{ github.event.inputs.backend_url || 'https://globalpulse-backend-staging.fly.dev' }}
      REQUESTED_SOURCE_KEY: ${{ github.event.inputs.source_key }}
      SCHEDULE_EXPR: ${{ github.event.schedule }}
      EDITION: ${{ github.event.inputs.edition || 'breaking' }}

    steps:
      - name: Checkout source registry
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            config/sources.yml
          sparse-checkout-cone-mode: false

      - name: Resolve sources from registry
        run: |
          python3 - <<'PY'
          import os
          import sys

          import yaml

          with open("config/sources.yml", "r", encoding="utf-8") as handle:
              registry = yaml.safe_load(handle)

          defaults = registry.get("defaults") or {}
          known_sources = {entry["key"] for entry in registry.get("sources") or []}
          groups = registry.get("groups") or []
          by_alias = {group["alias"]: group for group in groups}
          by_schedule = {group["schedule"]: group for group in groups}

          requested = os.environ.get("REQUESTED_SOURCE_KEY", "").strip()
          schedule = os.environ.get("SCHEDULE_EXPR", "").strip()

          if requested and requested in by_alias:
              group = by_alias[requested]
          elif requested:
              if requested not in known_sources:
                  print(f"warning: source key {requested!r} is not in config/sources.yml", file=sys.stderr)
              group = {"label": "single_source", "sources": [requested]}
          elif schedule and schedule in by_schedule:
              group = by_schedule[schedule]
          else:
              group = by_alias["hourly_default"]

          sources = group["sources"]

          cap = defaults.get("records_seen_cap", 25)

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_out:
              env_out.write(f"SOURCES={' '.join(sources)}\n")
              env_out.write(f"RUN_LABEL={group['label']}\n")
              env_out.write(f"RECORDS_SEEN_CAP={cap}\n")
          PY

      - name: Show target
        run: |
          echo "backend=${BACKEND_URL}"
          echo "sources=${SOURCES}"
          echo "run_label=${RUN_LABEL}"
          echo "schedule=${SCHEDULE_EXPR}"
          echo "edition=${EDITION}"
          echo "records_seen_cap=${RECORDS_SEEN_CAP}"

      - name: Health check
        run: |
          status=$(curl -sS -o health.json -w "%{http_code}" "${BACKEND_URL}/api/health")
          echo "health status=${status}"
          cat health.json
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            exit 1
          fi

      - name: Poll live sources
        run: |
          validate_poll_contract() {
            POLL_JSON="$1" POLL_SOURCE="$2" python3 - <<'PY'
          import json
          import os
          import sys

          path = os.environ["POLL_JSON"]
          source = os.environ["POLL_SOURCE"]
          cap = int(os.environ.get("RECORDS_SEEN_CAP", "25"))

          with open(path, "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          fetch = payload.get("fetch") or {}
          records_seen = payload.get("records_seen")
          records_inserted = payload.get("records_inserted")
          canonical_items = payload.get("canonical_items") or []
          raw_documents = payload.get("raw_documents") or []
          errors = []

          if fetch.get("mode") != "live":
              errors.append(f"{source}: expected fetch.mode=live, got {fetch.get('mode')!r}")

          if fetch.get("fixture_fallback") is True:
              errors.append(f"{source}: fixture_fallback=true cannot be claimed as live")

          if fetch.get("status_code") != 200:
              errors.append(f"{source}: expected fetch.status_code=200, got {fetch.get('status_code')!r}")

          if not isinstance(records_seen, int):
              errors.append(f"{source}: records_seen is not an integer")
          elif records_seen > cap:
              errors.append(f"{source}: records_seen {records_seen} exceeds canary cap {cap}")

          if not isinstance(records_inserted, int):
              errors.append(f"{source}: records_inserted is not an integer")
          elif isinstance(records_seen, int) and records_inserted > records_seen:
              errors.append(f"{source}: records_inserted {records_inserted} exceeds records_seen {records_seen}")

          if isinstance(records_seen, int) and len(canonical_items) > records_seen:
              errors.append(f"{source}: canonical_items count {len(canonical_items)} exceeds records_seen {records_seen}")

          if isinstance(records_seen, int) and len(raw_documents) > records_seen:
              errors.append(f"{source}: raw_documents count {len(raw_documents)} exceeds records_seen {records_seen}")

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          print(f"{source}: poll contract pass")
          PY
          }

          poll_with_retry() {
            source="$1"
            output="$2"
            poll_ok=0
            status=000

            for attempt in 1 2 3; do
              status=$(curl -sS -o "${output}" -w "%{http_code}" -X POST "${BACKEND_URL}/api/admin/sources/${source}/poll?use_live_fetch=true&edition=${EDITION}" || true)
              if [ -z "${status}" ]; then
                status=000
              fi

              echo "source=${source} poll attempt=${attempt} status=${status}"
              cat "${output}" || true

              if [ "${status}" -ge 200 ] && [ "${status}" -lt 300 ] && validate_poll_contract "${output}" "${source}"; then
                poll_ok=1
                break
              fi

              if [ "${attempt}" -lt 3 ]; then
                sleep $((attempt * 5))
              fi
            done

            if [ "${poll_ok}" != "1" ]; then
              echo "source=${source} poll failed after retries"
              return 1
            fi
          }

          failed=0
          for source in ${SOURCES}; do
            if ! poll_with_retry "${source}" "poll-${source}.json"; then
              failed=1
            fi
          done
          exit "${failed}"

      - name: Verify digest
        run: |
          digest_output="digest-${RUN_LABEL}.json"

          status=$(curl -sS -o "${digest_output}" -w "%{http_code}" "${BACKEND_URL}/api/feed/digest/latest?edition=${EDITION}")
          echo "digest status=${status}"
          cat "${digest_output}"
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            exit 1
          fi

          DIGEST_JSON="${digest_output}" python3 - <<'PY'
          import json
          import os
          import sys

          path = os.environ["DIGEST_JSON"]

          with open(path, "r", encoding="utf-8") as handle:
              payload = json.load(handle)

          metadata = payload.get("metadata") or {}

          if metadata.get("fallback_to_fixture") is not False:
              print(f"expected digest.metadata.fallback_to_fixture=false, got {metadata.get('fallback_to_fixture')!r}")
              sys.exit(1)

          print("digest contract pass")
          PY

      - name: Upload smoke outputs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: globalpulse-live-staging-poll-${{ github.run_id }}
          path: |
            health.json
            poll-*.json
            digest-*.json
          if-no-files-found: ignore
